<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Validation - Siege of Neverwinter</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/loading.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }
        h1 {
            color: #8b0000;
            border-bottom: 2px solid #8b0000;
            padding-bottom: 10px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: #333;
            border-radius: 5px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .test-pass {
            background: #1a4d1a;
            border-left: 4px solid #2d7a2d;
        }
        .test-fail {
            background: #4d1a1a;
            border-left: 4px solid #7a2d2d;
        }
        .test-info {
            background: #1a3a4d;
            border-left: 4px solid #2d5a7a;
        }
        button {
            background: #8b0000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #a00000;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .metric {
            font-weight: bold;
            color: #ffd700;
        }
        #map-container {
            width: 800px;
            height: 600px;
            background: #1a1a1a;
            border: 2px solid #444;
            margin: 10px 0;
        }
        .progress {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Performance Validation Tests</h1>
        
        <div class="test-section">
            <h2>Test Controls</h2>
            <button id="run-all-tests">Run All Tests</button>
            <button id="run-page-load">Test Page Load</button>
            <button id="run-api-tests">Test API Performance</button>
            <button id="run-sorting-tests">Test Initiative Sorting</button>
            <button id="run-map-tests">Test Map Rendering</button>
            <button id="clear-results">Clear Results</button>
        </div>

        <div class="test-section">
            <h2>Performance Requirements</h2>
            <div class="test-info">
                <p>✓ Initial page load: < 3000ms</p>
                <p>✓ API responses: < 500ms</p>
                <p>✓ Initiative sorting: < 10ms</p>
                <p>✓ Map rendering: < 100ms</p>
            </div>
        </div>

        <div id="results" class="test-section">
            <h2>Test Results</h2>
            <div id="results-container">
                <p class="test-info">Click "Run All Tests" to begin validation</p>
            </div>
        </div>

        <div id="map-container" style="display: none;"></div>
    </div>

    <script type="module">
        import { renderMap } from './js/cityMap.js';
        import { API_BASE_URL } from './js/api.js';

        const resultsContainer = document.getElementById('results-container');
        let testResults = [];

        function addResult(testName, passed, duration, threshold, details = '') {
            const result = {
                testName,
                passed,
                duration,
                threshold,
                details,
                timestamp: new Date().toISOString()
            };
            testResults.push(result);

            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${passed ? 'test-pass' : 'test-fail'}`;
            resultDiv.innerHTML = `
                <strong>${passed ? '✓' : '✗'} ${testName}</strong><br>
                Duration: <span class="metric">${duration.toFixed(2)}ms</span> 
                (Threshold: ${threshold}ms)<br>
                ${details ? `Details: ${details}<br>` : ''}
                ${passed ? 'PASS' : 'FAIL'}
            `;
            resultsContainer.appendChild(resultDiv);
        }

        function clearResults() {
            resultsContainer.innerHTML = '';
            testResults = [];
        }

        async function testPageLoad() {
            addResult('Page Load Test', true, performance.now(), 3000, 
                'Page loaded successfully. Check browser DevTools Network tab for detailed timing.');
            
            // Check if main resources loaded
            const resources = performance.getEntriesByType('resource');
            const totalSize = resources.reduce((sum, r) => sum + (r.transferSize || 0), 0);
            const totalDuration = resources.reduce((max, r) => Math.max(max, r.duration), 0);
            
            addResult('Resource Loading', totalDuration < 3000, totalDuration, 3000,
                `Loaded ${resources.length} resources (${(totalSize / 1024).toFixed(2)} KB)`);
        }

        async function testAPIPerformance() {
            const endpoints = [
                { name: 'GET /api/combatants', url: '/api/combatants?campaign_id=1' },
                { name: 'GET /api/monsters', url: '/api/monsters' },
                { name: 'GET /api/locations', url: '/api/locations?campaign_id=1' },
                { name: 'GET /api/plotpoints', url: '/api/plotpoints?campaign_id=1' },
                { name: 'GET /api/siege', url: '/api/siege?campaign_id=1' }
            ];

            for (const endpoint of endpoints) {
                try {
                    const start = performance.now();
                    const response = await fetch(`${API_BASE_URL}${endpoint.url}`);
                    const data = await response.json();
                    const duration = performance.now() - start;

                    const passed = duration < 500;
                    addResult(endpoint.name, passed, duration, 500,
                        `Status: ${response.status}, Records: ${Array.isArray(data) ? data.length : 'N/A'}`);
                } catch (error) {
                    addResult(endpoint.name, false, 0, 500, `Error: ${error.message}`);
                }
            }
        }

        function testInitiativeSorting() {
            const testSizes = [10, 50, 100, 200];

            for (const size of testSizes) {
                const combatants = Array.from({ length: size }, (_, i) => ({
                    id: i,
                    name: `Combatant ${i}`,
                    initiative: Math.floor(Math.random() * 30)
                }));

                const start = performance.now();
                combatants.sort((a, b) => b.initiative - a.initiative);
                const duration = performance.now() - start;

                const passed = duration < 10;
                addResult(`Initiative Sort (${size} combatants)`, passed, duration, 10,
                    `Sorted ${size} combatants`);
            }

            // Test with multiple iterations
            const iterations = 100;
            const durations = [];
            
            for (let i = 0; i < iterations; i++) {
                const combatants = Array.from({ length: 50 }, (_, j) => ({
                    id: j,
                    name: `Combatant ${j}`,
                    initiative: Math.floor(Math.random() * 30)
                }));

                const start = performance.now();
                combatants.sort((a, b) => b.initiative - a.initiative);
                durations.push(performance.now() - start);
            }

            const avgDuration = durations.reduce((a, b) => a + b, 0) / durations.length;
            const maxDuration = Math.max(...durations);

            addResult(`Initiative Sort Average (${iterations} runs)`, avgDuration < 10, avgDuration, 10,
                `Max: ${maxDuration.toFixed(2)}ms, Min: ${Math.min(...durations).toFixed(2)}ms`);
        }

        async function testMapRendering() {
            const mapContainer = document.getElementById('map-container');
            mapContainer.style.display = 'block';
            mapContainer.innerHTML = '';

            try {
                // Test loading locations
                const locStart = performance.now();
                const locResponse = await fetch(`${API_BASE_URL}/api/locations?campaign_id=1`);
                const locations = await locResponse.json();
                const locDuration = performance.now() - locStart;

                addResult('Map Data Load (Locations)', locDuration < 100, locDuration, 100,
                    `Loaded ${locations.length} locations`);

                // Test loading plot points
                const ppStart = performance.now();
                const ppResponse = await fetch(`${API_BASE_URL}/api/plotpoints?campaign_id=1`);
                const plotPoints = await ppResponse.json();
                const ppDuration = performance.now() - ppStart;

                addResult('Map Data Load (Plot Points)', ppDuration < 100, ppDuration, 100,
                    `Loaded ${plotPoints.length} plot points`);

                // Test rendering
                const renderStart = performance.now();
                await renderMap(mapContainer, locations, plotPoints);
                const renderDuration = performance.now() - renderStart;

                addResult('Map Rendering', renderDuration < 100, renderDuration, 100,
                    `Rendered ${locations.length} locations and ${plotPoints.length} plot points`);

                // Test re-rendering
                const reRenderStart = performance.now();
                await renderMap(mapContainer, locations, plotPoints);
                const reRenderDuration = performance.now() - reRenderStart;

                addResult('Map Re-rendering', reRenderDuration < 100, reRenderDuration, 100,
                    'Re-rendered existing map');

            } catch (error) {
                addResult('Map Rendering', false, 0, 100, `Error: ${error.message}`);
            } finally {
                mapContainer.style.display = 'none';
            }
        }

        async function runAllTests() {
            clearResults();
            
            const startTime = performance.now();
            
            addResult('Test Suite Started', true, 0, 0, new Date().toLocaleString());

            await testPageLoad();
            await testAPIPerformance();
            testInitiativeSorting();
            await testMapRendering();

            const totalDuration = performance.now() - startTime;
            
            const passedTests = testResults.filter(r => r.passed).length;
            const totalTests = testResults.length;
            
            addResult('Test Suite Complete', true, totalDuration, 0,
                `${passedTests}/${totalTests} tests passed`);

            // Generate summary
            const summary = document.createElement('div');
            summary.className = 'test-info';
            summary.innerHTML = `
                <h3>Summary</h3>
                <p>Total Tests: ${totalTests}</p>
                <p>Passed: ${passedTests}</p>
                <p>Failed: ${totalTests - passedTests}</p>
                <p>Success Rate: ${((passedTests / totalTests) * 100).toFixed(1)}%</p>
                <p>Total Duration: ${totalDuration.toFixed(2)}ms</p>
            `;
            resultsContainer.appendChild(summary);
        }

        // Event listeners
        document.getElementById('run-all-tests').addEventListener('click', runAllTests);
        document.getElementById('run-page-load').addEventListener('click', async () => {
            clearResults();
            await testPageLoad();
        });
        document.getElementById('run-api-tests').addEventListener('click', async () => {
            clearResults();
            await testAPIPerformance();
        });
        document.getElementById('run-sorting-tests').addEventListener('click', () => {
            clearResults();
            testInitiativeSorting();
        });
        document.getElementById('run-map-tests').addEventListener('click', async () => {
            clearResults();
            await testMapRendering();
        });
        document.getElementById('clear-results').addEventListener('click', clearResults);

        // Auto-run on page load
        window.addEventListener('load', () => {
            const loadTime = performance.now();
            if (loadTime < 3000) {
                console.log(`✓ Page loaded in ${loadTime.toFixed(2)}ms (< 3000ms)`);
            } else {
                console.warn(`✗ Page loaded in ${loadTime.toFixed(2)}ms (> 3000ms)`);
            }
        });
    </script>
</body>
</html>
